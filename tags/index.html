  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const nodes = document.querySelectorAll('.frequency-node');
      const summonWrappers = document.querySelectorAll('.summon-wrapper');
      const placeholder = document.getElementById('summon-placeholder');

      nodes.forEach(node => {
        node.addEventListener('click', () => {
          const filter = node.getAttribute('data-filter');

          
          const wasActive = node.classList.contains('active');
          nodes.forEach(n => n.classList.remove('active'));
          
          if (wasActive) {
            
            hideAll();
          } else {
            
            node.classList.add('active');
            showFilter(filter);
          }
        });
      });

      function showFilter(filter) {
        placeholder.style.display = 'none';
        
        summonWrappers.forEach(wrapper => {
          const tagsAttr = wrapper.getAttribute('data-tags');
          if (!tagsAttr) return;
          
          const tags = tagsAttr.split(',');
          if (tags.includes(filter)) {
            
            wrapper.style.display = 'block';
            setTimeout(() => {
              wrapper.style.opacity = '1';
              wrapper.style.transform = 'translateY(0)';
            }, 50);
          } else {
            
            wrapper.style.opacity = '0';
            wrapper.style.transform = 'translateY(20px)';
            setTimeout(() => {
              wrapper.style.display = 'none';
            }, 300);
          }
        });
      }

      function hideAll() {
        summonWrappers.forEach(wrapper => {
          wrapper.style.opacity = '0';
          wrapper.style.transform = 'translateY(20px)';
          setTimeout(() => {
            wrapper.style.display = 'none';
          }, 300);
        });
        setTimeout(() => {
          placeholder.style.display = 'block';
        }, 300);
      }
    });
  </script>
